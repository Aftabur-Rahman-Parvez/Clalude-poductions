<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="1600" height="1000">
  <defs>
    <linearGradient id="artBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0A17"/>
      <stop offset="55%" stop-color="#161029"/>
      <stop offset="100%" stop-color="#0C0B18"/>
    </linearGradient>
    <radialGradient id="artGlow" cx="50%" cy="46%" r="60%">
      <stop offset="0%" stop-color="#A78BFA" stop-opacity="0.30"/>
      <stop offset="45%" stop-color="#6366F1" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#6366F1" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="dbGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2A2250"/>
      <stop offset="100%" stop-color="#171331"/>
    </linearGradient>
    <linearGradient id="chipGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#6366F1"/>
    </linearGradient>
    <filter id="artBlurSoft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
    <filter id="artBlurBig" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="20"/>
    </filter>
  </defs>

  <rect width="1600" height="1000" fill="url(#artBg)"/>

  <g opacity="0.05" stroke="#C4B5FD" stroke-width="1">
    <path d="M0 125 H1600 M0 250 H1600 M0 375 H1600 M0 500 H1600 M0 625 H1600 M0 750 H1600 M0 875 H1600"/>
    <path d="M160 0 V1000 M320 0 V1000 M480 0 V1000 M640 0 V1000 M800 0 V1000 M960 0 V1000 M1120 0 V1000 M1280 0 V1000 M1440 0 V1000"/>
  </g>

  <circle cx="800" cy="470" r="440" fill="url(#artGlow)"/>

  <!-- Left: raw enterprise documents stacking into the pipeline -->
  <g transform="translate(140,330) rotate(-5)">
    <rect width="190" height="230" rx="14" fill="url(#dbGrad)" stroke="#A78BFA" stroke-opacity="0.35"/>
    <rect x="26" y="36" width="138" height="10" rx="5" fill="#C4B5FD" fill-opacity="0.6"/>
    <rect x="26" y="62" width="110" height="8" rx="4" fill="#C4B5FD" fill-opacity="0.3"/>
    <rect x="26" y="84" width="124" height="8" rx="4" fill="#C4B5FD" fill-opacity="0.3"/>
    <rect x="26" y="106" width="92" height="8" rx="4" fill="#C4B5FD" fill-opacity="0.3"/>
    <rect x="26" y="146" width="138" height="8" rx="4" fill="#C4B5FD" fill-opacity="0.2"/>
    <rect x="26" y="168" width="104" height="8" rx="4" fill="#C4B5FD" fill-opacity="0.2"/>
  </g>
  <g transform="translate(190,580) rotate(4)">
    <rect width="160" height="170" rx="14" fill="url(#dbGrad)" stroke="#818CF8" stroke-opacity="0.35"/>
    <rect x="22" y="32" width="112" height="10" rx="5" fill="#A5B4FC" fill-opacity="0.55"/>
    <rect x="22" y="58" width="92" height="8" rx="4" fill="#A5B4FC" fill-opacity="0.3"/>
    <rect x="22" y="80" width="100" height="8" rx="4" fill="#A5B4FC" fill-opacity="0.3"/>
  </g>

  <!-- Center: vector database cylinder stack -->
  <g transform="translate(560,300)">
    <ellipse cx="110" cy="18" rx="110" ry="30" fill="url(#dbGrad)" stroke="#A78BFA" stroke-width="2"/>
    <path d="M0 18 L0 150 A110 30 0 0 0 220 150 L220 18" fill="url(#dbGrad)" stroke="#A78BFA" stroke-width="2" stroke-opacity="0.6"/>
    <ellipse cx="110" cy="150" rx="110" ry="30" fill="none" stroke="#A78BFA" stroke-width="1.5" stroke-opacity="0.5"/>
    <ellipse cx="110" cy="95" rx="110" ry="30" fill="none" stroke="#A78BFA" stroke-width="1.5" stroke-opacity="0.35"/>
    <!-- embedding points scattered across the vector store -->
    <g fill="#C4B5FD">
      <circle cx="60" cy="55" r="4" opacity="0.9"/>
      <circle cx="95" cy="30" r="3" opacity="0.6"/>
      <circle cx="140" cy="48" r="4" opacity="0.8"/>
      <circle cx="170" cy="70" r="3" opacity="0.55"/>
      <circle cx="70" cy="100" r="3.5" opacity="0.7"/>
      <circle cx="120" cy="115" r="4" opacity="0.85"/>
      <circle cx="160" cy="130" r="3" opacity="0.5"/>
      <circle cx="45" cy="130" r="3" opacity="0.5"/>
    </g>
  </g>
  <text x="670" y="500" text-anchor="middle" font-family="monospace" font-size="20" fill="#C4B5FD" fill-opacity="0.65" letter-spacing="2">VECTOR DB</text>

  <!-- Connection: documents -> vector db -->
  <g stroke="#A78BFA" stroke-width="1.5" opacity="0.45">
    <path d="M330 420 Q450 400 560 400" fill="none"/>
    <path d="M350 650 Q460 560 560 480" fill="none"/>
  </g>

  <!-- Right: LLM chip / reasoning core -->
  <g filter="url(#artBlurBig)">
    <circle cx="1130" cy="470" r="140" fill="#8B5CF6" opacity="0.16"/>
  </g>
  <g transform="translate(1050,390)">
    <rect width="160" height="160" rx="22" fill="url(#chipGrad)"/>
    <rect x="18" y="18" width="124" height="124" rx="14" fill="#1A1333" opacity="0.55"/>
    <circle cx="80" cy="80" r="30" fill="none" stroke="#E9D5FF" stroke-width="2.5"/>
    <circle cx="80" cy="80" r="8" fill="#E9D5FF"/>
    <path d="M80 10 V34 M80 126 V150 M10 80 H34 M126 80 H150" stroke="#E9D5FF" stroke-width="2.5" stroke-linecap="round" opacity="0.8"/>
  </g>
  <text x="1130" y="600" text-anchor="middle" font-family="monospace" font-size="20" fill="#E9D5FF" fill-opacity="0.7" letter-spacing="2">LLM</text>

  <!-- Connection: vector db -> LLM -->
  <g stroke="#A78BFA" stroke-width="1.5" opacity="0.5">
    <path d="M780 420 Q920 410 1050 440" fill="none"/>
  </g>
  <circle cx="1040" cy="440" r="4" fill="#C4B5FD"/>

  <!-- Output: grounded, cited answer card -->
  <g transform="translate(1250,620)">
    <rect width="270" height="160" rx="16" fill="url(#dbGrad)" stroke="#C4B5FD" stroke-opacity="0.45"/>
    <circle cx="34" cy="36" r="10" fill="#34D399"/>
    <path d="M29 36 l4 4 l9 -9" stroke="#06241C" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="54" y="28" width="140" height="10" rx="5" fill="#C4B5FD" fill-opacity="0.6"/>
    <rect x="28" y="64" width="214" height="8" rx="4" fill="#9CA3AF" fill-opacity="0.35"/>
    <rect x="28" y="86" width="190" height="8" rx="4" fill="#9CA3AF" fill-opacity="0.35"/>
    <rect x="28" y="108" width="200" height="8" rx="4" fill="#9CA3AF" fill-opacity="0.35"/>
  </g>
  <g stroke="#A78BFA" stroke-width="1.5" opacity="0.5">
    <path d="M1130 530 Q1250 560 1310 620" fill="none"/>
  </g>

</svg>
