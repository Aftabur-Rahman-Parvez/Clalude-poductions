<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1100" width="1600" height="1100">
  <defs>
    <linearGradient id="bgH" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#140B23"/>
      <stop offset="55%" stop-color="#1E1033"/>
      <stop offset="100%" stop-color="#120A1F"/>
    </linearGradient>
    <radialGradient id="glowH" cx="50%" cy="42%" r="50%">
      <stop offset="0%" stop-color="#FB7185" stop-opacity="0.35"/>
      <stop offset="55%" stop-color="#8B5CF6" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#8B5CF6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="phoneBodyH" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#241539"/>
      <stop offset="100%" stop-color="#180D29"/>
    </linearGradient>
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FB7185"/>
      <stop offset="100%" stop-color="#8B5CF6"/>
    </linearGradient>
  </defs>

  <rect width="1600" height="1100" fill="url(#bgH)"/>
  <g opacity="0.07" stroke="#C4B5FD" stroke-width="1">
    <path d="M0 150 H1600 M0 300 H1600 M0 450 H1600 M0 600 H1600 M0 750 H1600 M0 900 H1600"/>
    <path d="M200 0 V1100 M400 0 V1100 M600 0 V1100 M800 0 V1100 M1000 0 V1100 M1200 0 V1100 M1400 0 V1100"/>
  </g>
  <circle cx="800" cy="440" r="430" fill="url(#glowH)"/>

  <!-- floating decorative icons -->
  <g opacity="0.55" stroke="#FCA5B1" fill="none" stroke-width="2.5">
    <path d="M220 250 c0 -14 14 -22 24 -14 c6 5 6 5 12 0 c10 -8 24 0 24 14 c0 16 -24 32 -36 38 c-12 -6 -24 -22 -24 -38 Z"/>
    <path d="M1300 270 c0 -11 11 -17 19 -11 c5 4 5 4 9 0 c8 -6 19 0 19 11 c0 12 -19 25 -28 30 c-9 -5 -19 -18 -19 -30 Z"/>
    <circle cx="1310" cy="800" r="26" stroke="#C4B5FD"/>
    <path d="M1298 800 h24 M1310 788 v24" stroke="#C4B5FD"/>
    <path d="M230 790 l16 16 M246 790 l-16 16" stroke="#C4B5FD"/>
  </g>

  <!-- Phone mockup -->
  <g transform="translate(610,90)">
    <rect x="-14" y="-14" width="408" height="748" rx="54" fill="#0D0718"/>
    <rect width="380" height="720" rx="42" fill="url(#phoneBodyH)" stroke="#3B2459" stroke-width="2"/>
    <rect x="18" y="18" width="344" height="684" rx="28" fill="#0F0A1C"/>

    <!-- status bar -->
    <text x="190" y="54" text-anchor="middle" fill="#E9E3FB" font-family="Arial, sans-serif" font-size="16" font-weight="600">9:41</text>

    <!-- header -->
    <text x="190" y="102" text-anchor="middle" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="24" font-weight="700">Today's Health</text>
    <text x="190" y="130" text-anchor="middle" fill="#B9A9E8" font-family="Arial, sans-serif" font-size="14">You're on track for your goal</text>

    <!-- heart rate card -->
    <g transform="translate(30,160)">
      <rect width="320" height="120" rx="18" fill="#1A1030"/>
      <path d="M22 60 c-6 -18 16 -18 10 0 c-1 3 -1 3 -2 0 c-6 -18 16 -18 10 0" fill="#FB7185" transform="translate(6,-10) scale(1.1)"/>
      <circle cx="40" cy="60" r="20" fill="#2A1A46"/>
      <path d="M30 60 c0 -8 6 -12 10 -7 c2 2 2 2 4 0 c4 -5 10 -1 10 7 c0 7 -10 14 -12 15 c-2 -1 -12 -8 -12 -15 Z" fill="#FB7185"/>
      <text x="70" y="52" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="30" font-weight="700">78</text>
      <text x="70" y="72" fill="#B9A9E8" font-family="Arial, sans-serif" font-size="13">bpm · resting</text>
      <polyline points="170,70 190,40 205,80 220,30 235,65 250,45 270,60 295,55" fill="none" stroke="#FB7185" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    <!-- activity ring -->
    <g transform="translate(190,350)">
      <circle r="70" fill="none" stroke="#2A1A46" stroke-width="16"/>
      <circle r="70" fill="none" stroke="url(#ringGrad)" stroke-width="16" stroke-linecap="round"
        stroke-dasharray="330 440" transform="rotate(-90)"/>
      <text y="-4" text-anchor="middle" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="30" font-weight="700">7,842</text>
      <text y="20" text-anchor="middle" fill="#B9A9E8" font-family="Arial, sans-serif" font-size="13">steps today</text>
    </g>

    <!-- stat rows -->
    <g transform="translate(30,470)">
      <rect width="150" height="80" rx="14" fill="#1A1030"/>
      <text x="18" y="30" fill="#B9A9E8" font-family="Arial, sans-serif" font-size="12">SLEEP</text>
      <text x="18" y="58" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="22" font-weight="700">7h 20m</text>
    </g>
    <g transform="translate(200,470)">
      <rect width="150" height="80" rx="14" fill="#1A1030"/>
      <text x="18" y="30" fill="#B9A9E8" font-family="Arial, sans-serif" font-size="12">CALORIES</text>
      <text x="18" y="58" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="22" font-weight="700">1,860</text>
    </g>

    <!-- reminder card -->
    <g transform="translate(30,570)">
      <rect width="320" height="70" rx="16" fill="#1A1030"/>
      <circle cx="35" cy="35" r="16" fill="#8B5CF6"/>
      <path d="M28 35 l5 5 l10 -11" stroke="#FFFFFF" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      <rect x="62" y="22" width="180" height="9" rx="4.5" fill="#D9CCF8"/>
      <rect x="62" y="40" width="120" height="7" rx="3.5" fill="#6B5590"/>
    </g>

    <!-- cta -->
    <rect x="30" y="652" width="320" height="52" rx="26" fill="#8B5CF6"/>
    <text x="190" y="684" text-anchor="middle" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="16" font-weight="700">Log Activity</text>
  </g>
</svg>
