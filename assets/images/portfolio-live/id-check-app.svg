<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1100" width="1600" height="1100">
  <defs>
    <linearGradient id="bgA" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#140B23"/>
      <stop offset="55%" stop-color="#1E1033"/>
      <stop offset="100%" stop-color="#120A1F"/>
    </linearGradient>
    <radialGradient id="glowA" cx="50%" cy="42%" r="50%">
      <stop offset="0%" stop-color="#A78BFA" stop-opacity="0.45"/>
      <stop offset="55%" stop-color="#8B5CF6" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#8B5CF6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="phoneBody" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#241539"/>
      <stop offset="100%" stop-color="#180D29"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C4B5FD"/>
      <stop offset="100%" stop-color="#8B5CF6"/>
    </linearGradient>
  </defs>

  <rect width="1600" height="1100" fill="url(#bgA)"/>
  <g opacity="0.07" stroke="#C4B5FD" stroke-width="1">
    <path d="M0 150 H1600 M0 300 H1600 M0 450 H1600 M0 600 H1600 M0 750 H1600 M0 900 H1600"/>
    <path d="M200 0 V1100 M400 0 V1100 M600 0 V1100 M800 0 V1100 M1000 0 V1100 M1200 0 V1100 M1400 0 V1100"/>
  </g>
  <circle cx="800" cy="440" r="430" fill="url(#glowA)"/>

  <!-- floating decorative icons -->
  <g opacity="0.5">
    <rect x="190" y="230" width="56" height="56" rx="14" fill="none" stroke="#C4B5FD" stroke-width="2.5"/>
    <path d="M206 258 l10 10 l20 -22" stroke="#C4B5FD" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="1330" cy="260" r="30" fill="none" stroke="#A78BFA" stroke-width="2.5"/>
    <path d="M1316 260 l10 10 l18 -20" stroke="#A78BFA" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="1260" y="760" width="70" height="50" rx="8" fill="none" stroke="#C4B5FD" stroke-width="2.5"/>
    <circle cx="1295" cy="785" r="10" fill="none" stroke="#C4B5FD" stroke-width="2.5"/>
    <rect x="240" y="800" width="60" height="44" rx="8" fill="none" stroke="#A78BFA" stroke-width="2.5"/>
  </g>

  <!-- Phone mockup -->
  <g transform="translate(610,90)">
    <rect x="-14" y="-14" width="408" height="748" rx="54" fill="#0D0718"/>
    <rect width="380" height="720" rx="42" fill="url(#phoneBody)" stroke="#3B2459" stroke-width="2"/>
    <rect x="18" y="18" width="344" height="684" rx="28" fill="#0F0A1C"/>

    <!-- status bar -->
    <text x="190" y="54" text-anchor="middle" fill="#E9E3FB" font-family="Arial, sans-serif" font-size="16" font-weight="600">9:41</text>

    <!-- header -->
    <text x="190" y="104" text-anchor="middle" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="24" font-weight="700">Identity Verification</text>
    <text x="190" y="132" text-anchor="middle" fill="#B9A9E8" font-family="Arial, sans-serif" font-size="14">Scan your ID to continue</text>

    <!-- ID card illustration -->
    <g transform="translate(55,175)">
      <rect width="270" height="168" rx="16" fill="url(#cardGrad)"/>
      <circle cx="56" cy="62" r="26" fill="#FFFFFF" fill-opacity="0.85"/>
      <rect x="100" y="42" width="140" height="12" rx="6" fill="#FFFFFF" fill-opacity="0.85"/>
      <rect x="100" y="64" width="110" height="9" rx="4.5" fill="#FFFFFF" fill-opacity="0.6"/>
      <rect x="30" y="112" width="210" height="8" rx="4" fill="#FFFFFF" fill-opacity="0.45"/>
      <rect x="30" y="132" width="150" height="8" rx="4" fill="#FFFFFF" fill-opacity="0.45"/>

      <!-- scan corners -->
      <g stroke="#FFFFFF" stroke-width="5" stroke-linecap="round" fill="none">
        <path d="M-10 -10 L-10 18 M-10 -10 L18 -10"/>
        <path d="M280 -10 L280 18 M280 -10 L252 -10"/>
        <path d="M-10 178 L-10 150 M-10 178 L18 178"/>
        <path d="M280 178 L280 150 M280 178 L252 178"/>
      </g>
    </g>

    <!-- verified badge -->
    <g transform="translate(160,380)">
      <circle cx="30" cy="30" r="30" fill="#34D399"/>
      <path d="M17 31 l9 9 l19 -20" stroke="#07241B" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <text x="190" y="448" text-anchor="middle" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="18" font-weight="700">Identity Verified</text>
    <text x="190" y="472" text-anchor="middle" fill="#9B8BC4" font-family="Arial, sans-serif" font-size="13">Liveness check passed • 1.8s</text>

    <!-- progress rows -->
    <g transform="translate(30,520)">
      <rect width="320" height="52" rx="14" fill="#1A1030"/>
      <circle cx="30" cy="26" r="12" fill="#8B5CF6"/>
      <rect x="54" y="16" width="150" height="9" rx="4.5" fill="#D9CCF8"/>
      <rect x="54" y="32" width="100" height="7" rx="3.5" fill="#6B5590"/>
      <text x="296" y="31" text-anchor="end" fill="#34D399" font-family="Arial, sans-serif" font-size="13" font-weight="700">Done</text>
    </g>
    <g transform="translate(30,584)">
      <rect width="320" height="52" rx="14" fill="#1A1030"/>
      <circle cx="30" cy="26" r="12" fill="#8B5CF6"/>
      <rect x="54" y="16" width="170" height="9" rx="4.5" fill="#D9CCF8"/>
      <rect x="54" y="32" width="120" height="7" rx="3.5" fill="#6B5590"/>
      <text x="296" y="31" text-anchor="end" fill="#34D399" font-family="Arial, sans-serif" font-size="13" font-weight="700">Done</text>
    </g>

    <!-- cta -->
    <rect x="30" y="652" width="320" height="52" rx="26" fill="#8B5CF6"/>
    <text x="190" y="684" text-anchor="middle" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="16" font-weight="700">Continue</text>
  </g>
</svg>
